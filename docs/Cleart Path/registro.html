<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cleart Path</title>
    <link rel="stylesheet" href="Cssregistro.css">
</head>
<body>
    <div class="formulario">
        <h1>Registro</h1>
        <form id="form-registro">
            <div class="campo">
                <input type="text" id="usuario" name="usuario" required placeholder=" ">
                <label for="usuario">Nombre de usuario</label>
            </div>
            <div class="campo">
                <input type="email" id="email" name="email" required placeholder=" ">
                <label for="email">Correo electrónico</label>
            </div>
            <div class="campo">
                <input type="password" id="pass" name="contraseña" required placeholder=" ">
                <label for="pass">Contraseña</label>
            </div>
            <div class="campo">
                <input type="password" id="pass2" name="confirmar" required placeholder=" ">
                <label for="pass2">Confirmar contraseña</label>
            </div>
            <a href="Bionist2.html" class="boton-registro" id="enlaceRegistro">Registrarse</a>
            <div class="registrarse">
                ¿Ya tienes cuenta? <a href="iniciosesion.html">Inicia sesión</a>
            </div>
            <div class="continuar-sin-registro">
                <a href="CleartPath.html" id="sinRegistro">Continuar sin registrarse</a>
            </div>
            <div id="error-pass" style="color:#b3002d; margin-top:8px; text-align:center;"></div>
        </form>
    </div>
    <script>
document.getElementById('enlaceRegistro').addEventListener('click', function(e) {
    const usuario = document.getElementById('usuario').value.trim();
    const email = document.getElementById('email').value.trim();
    const pass = document.getElementById('pass').value;
    const pass2 = document.getElementById('pass2').value;
    const error = document.getElementById('error-pass');
    if (!usuario || !email || !pass || !pass2) {
        e.preventDefault();
        error.textContent = 'Por favor, completa todos los campos.';
        return;
    }
    if (pass !== pass2) {
        e.preventDefault();
        error.textContent = 'Las contraseñas no coinciden';
        return;
    }
    if (pass.length < 6) {
        e.preventDefault();
        error.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        return;
    }
   
    
    localStorage.setItem('usuario', usuario);
    localStorage.setItem('email', email);
    localStorage.setItem('pass', pass);
    error.textContent = '';

});
document.getElementById('sinRegistro').addEventListener('click', function() {
    localStorage.removeItem('usuario');
});
</script>
</body>
</html>
